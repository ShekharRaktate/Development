<h1>Student register Application</h1>
<form #studentForm="ngForm" (ngSubmit)="addStudent(studentForm)">
    <label for="">Name:</label>
    <input type="text" #name (ngModel)="name" name="name" placeholder="Enter name.."><br>
    <label for="">Email:</label>
    <input type="text" #email (ngModel)="email" name="email" placeholder="  @mail.com.."><br>
    <label for="">Phone:</label>
    <input type="text" #mobile (ngModel)="mobile" name="mobile" placeholder="Phone no.."><br>
    <label for="">Address:</label>
    <input type="text" #address (ngModel)="address" name="address" placeholder="Enter address.."><br>
    <input type="submit" value="Register">


</form>
