<h1>Student register Application</h1>
<form #studentForm="ngForm" (ngSubmit)="updateStudent(studentResp)">
    <label for="">Name:</label>
    <input type="email" #name [(ngModel)]="studentResp.name" name="name" placeholder="Enter name.."><br>
    <label for="">Email:</label>
    <input type="text" #email [(ngModel)]="studentResp.email" name="email" placeholder="  @mail.com.."><br>
    <label for="">Phone:</label>
    <input type="text" #mobile [(ngModel)]="studentResp.mobile" name="mobile" placeholder="Phone no.."><br>
    <label for="">Address:</label>
    <input type="text" #address [(ngModel)]="studentResp.address" name="address" placeholder="Enter address.."><br>
    <input type="submit" value="Update">


</form>
