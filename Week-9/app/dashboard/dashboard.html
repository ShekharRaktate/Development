<H1>Employee Dashboard</H1>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Address</th>
      <th>Mobile</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <!-- Employee rows will be populated here -->
        <tr *ngFor="let employee of employees">
        <td>{{ employee.id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.address }}</td>
        <td>{{ employee.mobile }}</td>
        <td>
            <button (click)="editEmployee(employee.id)">Edit</button>
            <button (click)="deleteEmployee(employee.id)">Delete</button>
            <button (click)="viewEmployee(employee.id)">View</button>
        </td>
  </tbody>
</table>
